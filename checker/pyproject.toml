[project]
name = "c20-checker"
version = "0.1.0"
description = "Enochecker for the C20 service"
requires-python = "==3.12.*"
dependencies = [
    "enochecker-core",
    "enochecker3",
    "gunicorn",
    "uvicorn-worker",
    "sealy",
    "zstd",
    "pycryptodome",
]

[tool.uv]
package = false
override-dependencies = [
    "enochecker-core @ git+https://github.com/attacking-lab/enochecker-core@v0.22.0",
]

[tool.uv.sources]
enochecker-core = { git = "https://github.com/attacking-lab/enochecker-core", rev = "v0.22.0" }
enochecker3 = { git = "https://github.com/attacking-lab/enochecker3", rev = "v0.22.0" }

[dependency-groups]
dev = [
    "ruff",
    "ty",
    "mypy",
    "pytest",
]

[tool.pytest.ini_options]
testpaths = ["src/tests"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
mypy_path = "src"
files = ["src/checker.py", "src/fhe_exploit.py", "src/zkp_exploits", "src/tests"]

[tool.ruff.lint]
ignore = [
    "F403", # sealy's Bfv* / Plaintext / SecurityLevel API is used via `from sealy import *`
    "F405",
    "S112", # exploit loops intentionally skip unparseable candidates without logging
    "BLE001", # broad except is deliberate fault-tolerance over adversarial responses
]

[tool.ty.analysis]
# zkp_lib is a local compiled extension (no stub); zstd ships no type stubs
allowed-unresolved-imports = ["zkp_lib", "zstd"]
