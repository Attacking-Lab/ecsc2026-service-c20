<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>C20: Crypts &amp; Crypto — SEAL self-test</title>
  <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  <style>
    :root { --bg: #14151f; --panel: #2b2f45; --text: #e8eaf6; --muted: #9aa0c3; --ok: #7ee0a2; --bad: #ff8d8d; }
    body {
      margin: 0; padding: 32px; background: var(--bg); color: var(--text);
      font-family: system-ui, "Segoe UI", Roboto, sans-serif; line-height: 1.5;
    }
    main { max-width: 760px; margin: 0 auto; }
    h1 { font-size: 20px; margin: 0 0 8px; }
    p { color: var(--muted); margin: 0 0 20px; }
    ul { list-style: none; padding: 0; margin: 0; }
    li { padding: 8px 12px; border-radius: 6px; background: var(--panel); margin-bottom: 6px; font-family: ui-monospace, monospace; font-size: 13px; }
    li.pass { color: var(--ok); }
    li.fail { color: var(--bad); }
    pre { white-space: pre-wrap; color: var(--text); margin: 8px 0 0; }
    #summary { margin-top: 20px; font-weight: 600; }
    #summary.pass { color: var(--ok); }
    #summary.fail { color: var(--bad); }
  </style>
</head>
<body>
  <main>
    <h1>Client-side crypto self-test</h1>
    <p>Runs the service's FHE operations in this browser against fixtures produced by
      the service's own library (<code>web/seal-fixtures.json</code>).</p>
    <ul id="results"></ul>
    <p id="summary"></p>
  </main>
  <script type="module" src="./seal-selftest.js"></script>
</body>
</html>
