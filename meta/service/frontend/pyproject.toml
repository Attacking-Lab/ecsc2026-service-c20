[project]
name = "c20-frontend"
version = "0.1.0"
description = "C20 browser client: the web UI plus the Flask routes for rooms, tiles, sprites and the map editor"
requires-python = ">=3.12"
dependencies = [
    "pillow>=11",
]

[dependency-groups]
dev = ["ruff>=0.9"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
